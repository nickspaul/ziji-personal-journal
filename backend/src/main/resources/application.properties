server.address=127.0.0.1
server.port=${ZIJI_PORT:17890}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.application.name=ziji-local
spring.datasource.url=${ZIJI_DB_URL:jdbc:mysql://127.0.0.1:3306/ziji?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${ZIJI_DB_USER:ziji}
spring.datasource.password=${ZIJI_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00'
spring.flyway.enabled=true
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-message=never
server.error.include-stacktrace=never
ziji.data-directory=${ZIJI_DATA_DIR:./data}
ziji.allowed-origins=http://127.0.0.1:17890,http://localhost:17890,http://127.0.0.1:5173,http://localhost:5173
logging.level.org.springframework.web=INFO
